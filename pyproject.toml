[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ch9329f-python"
version = "0.1.0"
description = "Python driver for the WCH CH9329F UART-to-USB HID chip (protocol mode, keyboard/mouse)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
demo = ["PySide6>=6.5"]

[tool.setuptools.packages.find]
include = ["ch9329f*"]

[tool.setuptools.package-data]
ch9329f = ["py.typed"]
